# Dependabot — harmless to commit, activates only if the maintainer enables Dependabot for the
# repository. Keeps the pinned GitHub Actions (by SHA) and the Python dev/runtime dependencies
# current, opening small PRs that go through the same CI gate as any other change.
version: 2
updates:
  # Bump SHA-pinned GitHub Actions when a new release is tagged.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Bump Python dependencies (runtime + dev extras) declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "python"
