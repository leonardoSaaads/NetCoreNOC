name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# What v0.17.0 changed, and why (DECISIONS #335).
#
# Until this release CI was **one job** running lint, typecheck, deadcode, checksums, test, eval and
# security. Measured against what a maintainer would want to see before merging, four things were
# missing and each was missing silently:
#
#   * **the 74 DOM tests never ran.** They are ordinary pytest tests, so `make test` collected them —
#     and `skipped` them, because the runner had no Node and a skip is not a failure. Ten consecutive
#     releases shipped a console defect only a browser found. `make dom` on a runner WITH Node is in,
#     and the job asserts the count is non-zero so a silent skip cannot read as green.
#   * **coverage was measured and thrown away.** `make test` passes `--cov` and `fail_under = 85`, so
#     a drop below 85 % failed — but the number nobody recorded fell from 95.52 % to 86 % invisibly.
#     Reported now, on its own line.
#   * **the image was never built.** F85 shipped a wheel whose console was missing five modules, and
#     the only thing that catches that class is building the artifact. In.
#   * **the appliance was never started.** Every gate ran against source; nothing proved the thing
#     boots, applies sixteen migrations and answers `/healthz`. In, together with the testbed, which
#     is the first end-to-end check of the zero-configuration claim this repository has ever had.
#
# **Four parallel jobs, not one serial one.** The old job took its steps in sequence and a lint error
# hid the test results behind it. Parallel jobs cost the same runner minutes and give four independent
# answers, which is what a maintainer reads. `static` is the fast one and finishes first.
#
# **`make dom` does not need the appliance and `lab` does not need Node**, so nothing here is ordered
# by anything but its own dependencies.

jobs:
  # 1. Everything that reads files and nothing else. Fast, and first to tell you you typed a name
  #    wrong. Split from the test job so a formatting error does not hide a failing assertion.
  static:
    name: static (lint, types, deadcode, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: make lint PYTHON=python
      - name: Typecheck
        run: make typecheck PYTHON=python
      - name: Dead-code gate (vulture + committed allowlist)
        run: make deadcode PYTHON=python
      - name: Security scan (bandit; the offline half of `make security`)
        run: make scan PYTHON=python
      - name: Dependency audit (pip-audit; queries PyPI, hence its own step)
        run: python -m pip_audit

  # 2. The suite, the coverage number, the eval gate and the behaviour record.
  tests:
    name: tests (suite, coverage, eval, behaviour record)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Vendor checksum (d3 supply-chain pin)
        run: make checksums PYTHON=python
      - name: Suite with coverage
        run: make test PYTHON=python
      - name: Coverage, reported rather than only gated
        # `make test` already fails under 85 %. This prints coverage.py's own `Total coverage:`
        # line into the job summary so a slide from 95 % to 86 % is visible instead of merely legal.
        run: |
          make coverage PYTHON=python | tee coverage.txt
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          grep 'Total coverage:' coverage.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluation gate (pairwise_f1, ari, entity_accuracy)
        run: make eval PYTHON=python
      - name: The eval hash, recorded
        # Held at c2e8a0ce… since v0.7.0. Printed so a release note never has to be taken on trust,
        # and so a baseline re-cut (`make eval-baseline REASON=…`) is visible in the log that ran it.
        run: |
          python eval/harness.py | sha256sum | tee eval-hash.txt
          echo "### make eval" >> "$GITHUB_STEP_SUMMARY"
          cat eval-hash.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Behaviour-identity record
        run: python -m pytest -q tests/test_behaviour_identity.py
      - name: Secret-leak scan
        # Drives login/token/user flows under caplog and asserts no secret value appears in a line.
        run: python -m pytest -q tests/test_findings.py -k "secret_leak or redaction"

  # 3. The console, in a DOM, with Node actually present. **The job that did not exist.**
  console:
    name: console (DOM tests, executed not skipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Check the runner's Node, and say so rather than skipping
        # **No `actions/setup-node` here, deliberately, and the reason is honesty about pinning.**
        # `tests/test_workflows.py` requires every action to be pinned by a 40-character commit SHA,
        # and the environment v0.17.0 was built in cannot reach github.com/actions/* to look one up —
        # so pinning `setup-node` would mean committing a SHA nobody in this release verified, and a
        # wrong pin fails the job with an error that points at nothing.
        #
        # `ubuntu-latest` ships Node in its toolcache, so the ordinary case needs no action at all.
        # If the runner image ever carries a Node older than the harness's floor, this step FAILS
        # with the remedy in its message rather than letting the next step skip quietly — which is
        # the whole defect this job exists to close.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::no node on the runner. Add actions/setup-node, pinned by a commit SHA"
            echo "::error::you have verified, with node-version: 22."
            exit 1
          fi
          node --version
          major=$(node --version | sed 's/^v\([0-9]*\).*/\1/')
          if [ "$major" -lt 22 ]; then
            echo "::error::Node $major is below the DOM harness floor of 22 (domdriver.NODE_MIN_MAJOR)."
            echo "::error::Add actions/setup-node, pinned by a commit SHA you have verified."
            exit 1
          fi
      - name: DOM tests
        # The harness SKIPS when Node is absent, loudly, and a skipped suite must never read as a
        # green one (SCOPE-0.12.0 §7). So the count is asserted rather than the exit code: `-p
        # no:cacheprovider` and `--strict-markers` keep the selection honest, and the grep below
        # fails the job if the line says "skipped" or if no test ran at all.
        run: |
          make dom PYTHON=python | tee dom.txt
          if grep -q 'skipped' dom.txt; then
            echo "::error::DOM tests SKIPPED on a runner with Node — the harness did not run."
            exit 1
          fi
          grep -Eq '[1-9][0-9]* passed' dom.txt || {
            echo "::error::no DOM test executed; a collected count is not a result."
            exit 1
          }
          echo "### DOM tests" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'passed|failed' dom.txt >> "$GITHUB_STEP_SUMMARY"

  # 4. The artifacts, and the appliance actually running. **Neither existed before.**
  appliance:
    name: appliance (wheel, image, boot, /healthz, testbed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]

      - name: Build sdist and wheel
        run: make dist PYTHON=python

      - name: Install the wheel into a clean venv and boot it
        # F85's class: a wheel whose console is missing five modules passes every source-tree gate.
        # The only thing that catches it is installing the artifact and asking it for a page.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          NETCORENOC_DB=/tmp/ci.db NETCORENOC_TRAP_PORT=1162 \
            /tmp/clean/bin/python -m netcorenoc.main &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          # The console, from the wheel — this is the assertion F85 needed.
          curl -fsS -o /dev/null http://127.0.0.1:8080/app.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/app/views/overview.js
          python - <<'PY'
          import sqlite3
          v = sqlite3.connect("/tmp/ci.db").execute("PRAGMA user_version").fetchone()[0]
          assert v == 16, f"the appliance booted at schema {v}, not 16"
          print(f"schema version {v}, all migrations applied")
          PY
          kill %1

      - name: Build the container image
        run: make dist-image

      - name: The testbed, driven end to end
        # The first end-to-end check of the zero-configuration claim: two hosts with distinct
        # addresses, a fibre cut, the storm, the clears. Reported from the DATABASE, not a log line.
        #
        # `run_local.py` rather than `docker compose up`: the compose path needs a registry pull and
        # this job has already built the image it would use, so driving the lab directly tests the
        # lab instead of testing Docker networking.
        run: |
          python testbed/run_local.py --demo --cycles 3 --hold-s 18 --settle-s 16
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("testbed/state/testbed.db")
          db.row_factory = sqlite3.Row
          sources = [r["ip"] for r in db.execute("SELECT DISTINCT ip FROM device ORDER BY ip")]
          assert len(sources) == 2, f"the receiver recorded {sources}; the lab has two hosts"
          status = dict(db.execute("SELECT status, COUNT(*) FROM alarm GROUP BY status").fetchall())
          assert status.get("cleared", 0) > 0, f"the repair cleared nothing: {status}"
          assert status.get("active", 0) == 0, f"alarms still active after the repair: {status}"
          biggest = db.execute(
              "SELECT situation_id, COUNT(*) n FROM situation_alarm "
              "GROUP BY situation_id ORDER BY n DESC LIMIT 1"
          ).fetchone()
          assert biggest["n"] >= 10, f"the storm did not correlate: largest situation {biggest['n']}"
          pairs = db.execute("SELECT COUNT(*) FROM edge WHERE kind='clear_pair'").fetchone()[0]
          assert pairs >= 2, f"only {pairs} clear pair(s) learned; the vendor arc needs alternation"
          print(f"sources={sources} alarms={status} largest_situation={biggest['n']} pairs={pairs}")
          PY
