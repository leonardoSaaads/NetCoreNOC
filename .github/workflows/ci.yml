name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: make lint PYTHON=python
      - name: Typecheck
        run: make typecheck PYTHON=python
      - name: Dead-code gate (vulture + committed allowlist)
        run: make deadcode PYTHON=python
      - name: Vendor checksum (d3 supply-chain pin)
        run: make checksums PYTHON=python
      - name: Tests with coverage
        run: make test PYTHON=python
      - name: Evaluation (fails on regression in pairwise_f1, ari, entity_accuracy)
        run: make eval PYTHON=python
      - name: Secret-leak scan
        # Runs the app through login/token/user flows under caplog and asserts no secret
        # value (password, session id, token) appears in any captured log line.
        run: python -m pytest -q tests/test_findings.py -k "secret_leak or redaction"
      - name: Security scan
        run: make security PYTHON=python
