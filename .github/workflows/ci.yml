name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# What v0.17.0 changed, and why (DECISIONS #335).
#
# Until this release CI was **one job** running lint, typecheck, deadcode, checksums, test, eval and
# security. Measured against what a maintainer would want to see before merging, four things were
# missing and each was missing silently:
#
#   * **the 74 DOM tests never ran.** They are ordinary pytest tests, so `make test` collected them —
#     and `skipped` them, because the runner had no Node and a skip is not a failure. Ten consecutive
#     releases shipped a console defect only a browser found. `make dom` on a runner WITH Node is in,
#     and the job asserts the count is non-zero so a silent skip cannot read as green.
#   * **coverage was measured and thrown away.** `make test` passes `--cov` and `fail_under = 85`, so
#     a drop below 85 % failed — but the number nobody recorded fell from 95.52 % to 86 % invisibly.
#     Reported now, on its own line.
#   * **the image was never built.** F85 shipped a wheel whose console was missing five modules, and
#     the only thing that catches that class is building the artifact. In.
#   * **the appliance was never started.** Every gate ran against source; nothing proved the thing
#     boots, applies sixteen migrations and answers `/healthz`. In, together with the lab, which
#     is the first end-to-end check of the zero-configuration claim this repository has ever had.
#
# **Four parallel jobs, not one serial one.** The old job took its steps in sequence and a lint error
# hid the test results behind it. Parallel jobs cost the same runner minutes and give four independent
# answers, which is what a maintainer reads. `static` is the fast one and finishes first.
#
# **`make dom` does not need the appliance and `lab` does not need Node**, so nothing here is ordered
# by anything but its own dependencies.
#
# **PostgreSQL** (ADR #452). The suite, `make eval` and the behaviour record make throwaway databases
# with `tools/pgtemp.py`, which starts a private cluster from the runner's own PostgreSQL binaries
# (Ubuntu runners carry them; the step below installs them if an image ever does not). The
# appliance job runs the runner's PostgreSQL service, as a host would; the `compose` job runs the
# product's own `docker compose` stack, images pulled from Docker Hub.

jobs:
  # 1. Everything that reads files and nothing else. Fast, and first to tell you you typed a name
  #    wrong. Split from the test job so a formatting error does not hide a failing assertion.
  static:
    name: static (lint, types, deadcode, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: make lint PYTHON=python
      - name: Typecheck
        run: make typecheck PYTHON=python
      - name: Dead-code gate (vulture + committed allowlist)
        run: make deadcode PYTHON=python
      - name: Security scan (bandit; the offline half of `make security`)
        run: make scan PYTHON=python
      - name: Dependency audit (pip-audit; queries PyPI, hence its own step)
        # --skip-editable: the project itself is not on PyPI; see the Makefile's `security` target.
        run: python -m pip_audit --skip-editable

  # 2. The suite, the coverage number, the eval gate and the behaviour record.
  tests:
    name: tests (suite, coverage, eval, behaviour record)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: PostgreSQL binaries for throwaway test databases
        run: |
          ls /usr/lib/postgresql/*/bin/pg_ctl 2>/dev/null || {
            sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql
          }
          ls /usr/lib/postgresql/*/bin/pg_ctl
      - name: Vendor checksum (d3 supply-chain pin)
        run: make checksums PYTHON=python
      - name: Suite with coverage
        run: make test PYTHON=python
      - name: Coverage, reported rather than only gated
        # `make test` already fails under 85 %. This prints coverage.py's own `Total coverage:`
        # line into the job summary so a slide from 95 % to 86 % is visible instead of merely legal.
        run: |
          make coverage PYTHON=python | tee coverage.txt
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          grep 'Total coverage:' coverage.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluation gate (pairwise_f1, ari, entity_accuracy)
        run: make eval PYTHON=python
      - name: The eval hash, recorded
        # `c80b818b…` today (v0.29.0's focused round: two DWDM scenarios, logistic regression
        # decides); `31ea7583…` in its first round (the decision tree decided; v0.26.0
        # printed the same digest); `43328080…` in v0.27.0-v0.28.1 (the league's champion
        # decides; the gate reads every scenario); `31ea7583…` in v0.26.0; `c75b42aa…` from v0.18.0 and `c2e8a0ce…`
        # from v0.7.0 until the corpus was re-cut, which
        # `CHANGELOG.md` records. Printed so a release note never has to be taken on trust,
        # and so a baseline re-cut (`make eval-baseline REASON=…`) is visible in the log that ran it.
        run: |
          python eval/harness.py | sha256sum | tee eval-hash.txt
          echo "### make eval" >> "$GITHUB_STEP_SUMMARY"
          cat eval-hash.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Behaviour-identity record
        run: python -m pytest -q tests/repo/test_behaviour_identity.py
      - name: Secret-leak scan
        # Drives login/token/user flows under caplog and asserts no secret value appears in a line.
        run: python -m pytest -q tests/security/test_findings.py -k "secret_leak or redaction"

  # 3. The console, in a DOM, with Node actually present. **The job that did not exist.**
  console:
    name: console (DOM tests, executed not skipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Check the runner's Node, and say so rather than skipping
        # **No `actions/setup-node` here, deliberately, and the reason is honesty about pinning.**
        # `tests/ops/test_workflows.py` requires every action to be pinned by a 40-character commit SHA,
        # and the environment v0.17.0 was built in cannot reach github.com/actions/* to look one up —
        # so pinning `setup-node` would mean committing a SHA nobody in this release verified, and a
        # wrong pin fails the job with an error that points at nothing.
        #
        # `ubuntu-latest` ships Node in its toolcache, so the ordinary case needs no action at all.
        # If the runner image ever carries a Node older than the harness's floor, this step FAILS
        # with the remedy in its message rather than letting the next step skip quietly — which is
        # the whole defect this job exists to close.
        run: |
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::no node on the runner. Add actions/setup-node, pinned by a commit SHA"
            echo "::error::you have verified, with node-version: 22."
            exit 1
          fi
          node --version
          major=$(node --version | sed 's/^v\([0-9]*\).*/\1/')
          if [ "$major" -lt 22 ]; then
            echo "::error::Node $major is below the DOM harness floor of 22 (domdriver.NODE_MIN_MAJOR)."
            echo "::error::Add actions/setup-node, pinned by a commit SHA you have verified."
            exit 1
          fi
      - name: DOM tests
        # The harness SKIPS when Node is absent, loudly, and a skipped suite must never read as a
        # green one (SCOPE-0.12.0 §7). So the count is asserted rather than the exit code: `-p
        # no:cacheprovider` and `--strict-markers` keep the selection honest, and the grep below
        # fails the job if the line says "skipped" or if no test ran at all.
        run: |
          make dom PYTHON=python | tee dom.txt
          if grep -q 'skipped' dom.txt; then
            echo "::error::DOM tests SKIPPED on a runner with Node — the harness did not run."
            exit 1
          fi
          grep -Eq '[1-9][0-9]* passed' dom.txt || {
            echo "::error::no DOM test executed; a collected count is not a result."
            exit 1
          }
          echo "### DOM tests" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'passed|failed' dom.txt >> "$GITHUB_STEP_SUMMARY"

  # 4. The artifacts, and the appliance actually running. **Neither existed before.**
  appliance:
    name: appliance (wheel, image, boot, /healthz, lab)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .[dev]

      - name: Build sdist and wheel
        run: make dist PYTHON=python

      - name: PostgreSQL, as a host would run it
        # The runner's own service, two roles with passwords in files only this job reads
        # (`NETCORENOC_DATABASE_PASSWORD_FILE`): the schema's owner, and the appliance's runtime
        # role, which owns nothing (ADR #453). The lab's database beside them.
        run: |
          sudo systemctl start postgresql.service
          umask 077
          python -c "import secrets; print(secrets.token_urlsafe(24))" > /tmp/db_password
          python -c "import secrets; print(secrets.token_urlsafe(24))" > /tmp/db_app_password
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v pw="$(cat /tmp/db_password)" \
            -v apw="$(cat /tmp/db_app_password)" <<'SQL'
          CREATE ROLE netcorenoc LOGIN PASSWORD :'pw';
          CREATE ROLE netcorenoc_app LOGIN PASSWORD :'apw';
          CREATE DATABASE netcorenoc OWNER netcorenoc;
          REVOKE ALL ON DATABASE netcorenoc FROM PUBLIC;
          GRANT CONNECT ON DATABASE netcorenoc TO netcorenoc_app;
          CREATE DATABASE lab OWNER netcorenoc;
          SQL

      - name: Install the wheel into a clean venv and boot it
        # F85's class: a wheel whose console is missing five modules passes every source-tree gate.
        # The only thing that catches it is installing the artifact and asking it for a page.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          # ADR #453: the owner migrates and grants; the appliance runs as a role that owns nothing.
          NETCORENOC_DATABASE_URL=postgresql://netcorenoc@127.0.0.1:5432/netcorenoc \
            NETCORENOC_DATABASE_PASSWORD_FILE=/tmp/db_password \
            NETCORENOC_DB_RUNTIME_ROLE=netcorenoc_app /tmp/clean/bin/python -m netcorenoc db migrate
          export NETCORENOC_DATABASE_URL=postgresql://netcorenoc_app@127.0.0.1:5432/netcorenoc
          export NETCORENOC_DATABASE_PASSWORD_FILE=/tmp/db_app_password
          NETCORENOC_DATA_DIR=/tmp/ci-data NETCORENOC_TRAP_PORT=1162 \
            /tmp/clean/bin/python -m netcorenoc.main &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          # The console, from the wheel — this is the assertion F85 needed.
          curl -fsS -o /dev/null http://127.0.0.1:8080/app.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/app/views/overview.js
          # The schema version, as a literal (v0.21.0's rule): a release that adds a migration changes
          # this line in the same commit, which is what makes the schema a reviewable diff rather
          # than a thing that grew. 31 is the PostgreSQL baseline (ADR #452), 32 the hardening (#453),
          # 33 the NOC's credential vault (#455), 39 the customers' books (#473); SQLite's last was
          # 30. `tests/store/test_store.py` carries the same pin for the same reason.
          v=$(NETCORENOC_SECRET_KEY_FILE=/tmp/ci-data/secret.key \
            /tmp/clean/bin/python -m netcorenoc db status | awk '$1 == "version" {print $2}')
          test "$v" = 41 || { echo "::error::the appliance booted at schema $v, not 41"; exit 1; }
          echo "schema version $v, all migrations applied"
          # The key was created owner-only beside the spool, and the runtime role owns no table.
          test "$(stat -c %a /tmp/ci-data/secret.key)" = 600
          # ADR #455: and the secrets key, the device credentials' second key, owner-only too.
          test "$(stat -c %a /tmp/ci-data/secrets.key)" = 600
          owned=$(PGPASSWORD="$(cat /tmp/db_password)" psql -h 127.0.0.1 -U netcorenoc -d netcorenoc \
            -Atc "SELECT count(*) FROM pg_tables WHERE schemaname='netcorenoc' AND tableowner='netcorenoc_app'")
          test "$owned" = 0 || { echo "::error::the runtime role owns $owned tables"; exit 1; }
          # v0.27.0: the league is package data (ADR #424). A wheel that dropped a member would boot
          # on fewer models, or on the fail-safe formula, and say so in the bell — correct, and
          # exactly the silent loss F85 was. So the wheel must carry every member the tree carries,
          # each validated as data, none refused.
          TREE_MEMBERS=$(find src/netcorenoc/engine/model/league -name '*.manifest.json' 2>/dev/null | wc -l)
          /tmp/clean/bin/python - "$TREE_MEMBERS" <<'PY'
          import sys
          from netcorenoc.engine.model import league
          packaged = league.load()
          assert not packaged.refused, f"the wheel refused league members: {packaged.refused}"
          want = int(sys.argv[1])
          got = len(packaged.members)
          assert got == want, f"the wheel carries {got} league member(s), the tree {want}"
          print("league:", ", ".join(m.ref for m in packaged.members) or "no member")
          PY
          kill %1

      - name: Build the container image
        run: make dist-image

      - name: The lab, driven end to end
        # The first end-to-end check of the zero-configuration claim: two hosts with distinct
        # addresses, a fibre cut, the storm, the clears. Reported from the DATABASE, not a log line.
        #
        # `run_local.py` rather than `docker compose up`: the compose path needs a registry pull and
        # this job has already built the image it would use, so driving the lab directly tests the
        # lab instead of testing Docker networking.
        run: |
          export LAB_URL="postgresql://netcorenoc:$(cat /tmp/db_password)@127.0.0.1:5432/lab"
          python tests/lab/run_local.py --demo --cycles 3 --hold-s 18 --settle-s 16 \
            --database-url "$LAB_URL"
          python - <<'PY'
          import asyncio
          import os

          import asyncpg


          class DB:
              """The few calls below, synchronous, over the lab's schema (ADR #452)."""

              def __init__(self, url):
                  self.loop = asyncio.new_event_loop()
                  self.conn = self.loop.run_until_complete(
                      asyncpg.connect(url, server_settings={"search_path": "netcorenoc"})
                  )

              def rows(self, sql, *args):
                  return self.loop.run_until_complete(self.conn.fetch(sql, *args))

              def one(self, sql, *args):
                  return self.loop.run_until_complete(self.conn.fetchval(sql, *args))


          db = DB(os.environ["LAB_URL"])
          sources = [r["ip"] for r in db.rows("SELECT DISTINCT host(ip) AS ip FROM ne ORDER BY 1")]
          assert len(sources) == 2, f"the receiver recorded {sources}; the lab has two hosts"
          status = {r[0]: r[1] for r in db.rows("SELECT status, COUNT(*) FROM alarm GROUP BY status")}
          assert status.get("cleared", 0) > 0, f"the repair cleared nothing: {status}"
          # v0.17.1 (#345, F126): the cut phase raises ONE alarm that carries no severity column
          # and has no clear, so the lab deliberately settles with it still active. `active == 0`
          # would now assert that the lab had stopped demonstrating the unplaced half of the
          # census — the half prime directive 1 is about. So name it instead of relaxing it.
          still = [
              dict(r)
              for r in db.rows(
                  "SELECT c.oid AS oid, a.instance, a.varbinds::text AS varbinds FROM alarm a "
                  "JOIN alarm_class c ON c.id=a.class_id WHERE a.status='active'"
              )
          ]
          assert len(still) == 1, f"expected exactly the unplaced alarm, got {still}"
          assert still[0]["oid"] == "1.3.6.1.4.1.2011.6.128.1.1.4.7", (
              f"the one alarm left active is not the rectifier fault: {still[0]}"
          )
          # And it is still active for the RIGHT reason: it carries no severity word at all, so
          # the appliance cannot place it and does not invent one.
          import json
          from netcorenoc.ingest import known_oids
          carried = known_oids.standard_severity(json.loads(still[0]["varbinds"]))
          assert carried is None, (
              f"the alarm meant to be unplaceable carries a severity word: {carried}"
          )
          # v0.28.0 (#432): the repair's X.733 `cleared` notifications used to be ingested as
          # alarms and to join the cut's situations — they are what carried the old `largest
          # situation >= 10` past its bar (9 fault alarms + 7 clears). The storm itself is
          # unchanged, so it is asserted directly: no clear grouped as an alarm, and each host's
          # cut alarms together in one situation (the steady phase's link 999 predates the cut).
          grouped_clears = db.one(
              "SELECT COUNT(*) FROM situation_alarm sa JOIN alarm a ON a.id=sa.alarm_id "
              "WHERE a.severity='cleared'"
          )
          assert grouped_clears == 0, f"{grouped_clears} clear notification(s) grouped as alarms"
          background = ("1.3.6.1.6.3.1.1.5.3", "999")
          for ip in sources:
              faults = db.one(
                  "SELECT COUNT(*) FROM alarm a JOIN ne d ON d.id=a.ne_id "
                  "JOIN alarm_class c ON c.id=a.class_id WHERE host(d.ip)=$1 "
                  "AND NOT (c.oid=$2 AND a.instance=$3)",
                  ip,
                  *background,
              )
              together = db.one(
                  "SELECT MAX(n) FROM (SELECT COUNT(*) n FROM situation_alarm sa "
                  "JOIN alarm a ON a.id=sa.alarm_id JOIN ne d ON d.id=a.ne_id "
                  "JOIN alarm_class c ON c.id=a.class_id WHERE host(d.ip)=$1 "
                  "AND NOT (c.oid=$2 AND a.instance=$3) GROUP BY sa.situation_id) s",
                  ip,
                  *background,
              )
              assert faults >= 5 and together == faults, (
                  f"{ip}'s storm did not correlate: {together} of its {faults} cut alarms together"
              )
          biggest = db.rows(
              "SELECT situation_id, COUNT(*) n FROM situation_alarm "
              "GROUP BY situation_id ORDER BY n DESC LIMIT 1"
          )[0]
          pairs = db.one("SELECT COUNT(*) FROM edge WHERE kind='clear_pair'")
          assert pairs >= 2, f"only {pairs} clear pair(s) learned; the vendor arc needs alternation"
          print(f"sources={sources} alarms={status} largest_situation={biggest['n']} pairs={pairs}")
          PY

  # 5. The product's own `docker compose` stack: the database it brings, its generated password, its
  #    health checks, the appliance on top. Images from Docker Hub, so this is the one job that
  #    tests what an operator's first `docker compose up` does (ADR #452).
  compose:
    name: compose (PostgreSQL, generated secret, health, Supabase override)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Up, with a high trap port so no capability is needed
        run: |
          export NETCORENOC_TRAP_PORT=1162
          docker compose up --build --detach
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          echo
          curl -fsS http://127.0.0.1:8080/readyz
          echo
      - name: The database is PostgreSQL, migrated, and not reachable from the host
        run: |
          docker compose exec -T netcorenoc python -m netcorenoc db status | tee status.txt
          grep -q '^version *41 ' status.txt
          docker compose ps --format '{{.Service}} {{.Ports}}' | tee ports.txt
          ! grep -E '^postgres .*->5432' ports.txt  # exposed on the network, published nowhere
          docker compose logs db-migrate | grep -q 'at version 41: migrations applied'
          # ADR #455: the secrets key was created owner-only on its own volume, not beside secret.key.
          test "$(docker compose exec -T netcorenoc stat -c %a /var/lib/netcorenoc-vault/secrets.key)" = 600
          ! docker compose exec -T netcorenoc test -e /home/netcorenoc/secrets.key
      - name: Neither role is a superuser, and the appliance's owns nothing (ADR #453)
        run: |
          docker compose exec -T postgres sh -c 'PGPASSWORD="$(cat /run/netcorenoc-secrets/db_password)" \
            psql -h 127.0.0.1 -U netcorenoc -d netcorenoc -Atc \
            "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles
             WHERE rolname IN ('"'"'netcorenoc'"'"', '"'"'netcorenoc_app'"'"') ORDER BY 1"' \
            | tee role.txt
          grep -qx 'netcorenoc|f|f|f' role.txt
          grep -qx 'netcorenoc_app|f|f|f' role.txt
          docker compose exec -T postgres sh -c 'PGPASSWORD="$(cat /run/netcorenoc-secrets/db_password)" \
            psql -h 127.0.0.1 -U netcorenoc -d netcorenoc -Atc \
            "SELECT count(*) FROM pg_tables WHERE tableowner = '"'"'netcorenoc_app'"'"'"' | tee owned.txt
          grep -qx '0' owned.txt
          # The appliance connects as the runtime role, which may not truncate the audit log.
          ! docker compose exec -T postgres sh -c 'PGPASSWORD="$(cat /run/netcorenoc-secrets/db_app_password)" \
            psql -h 127.0.0.1 -U netcorenoc_app -d netcorenoc -v ON_ERROR_STOP=1 -c \
            "TRUNCATE netcorenoc.audit_log"'
      - name: The secret key exists, owner-only, in the appliance's volume
        run: |
          docker compose exec -T netcorenoc sh -c 'test "$(stat -c %a /home/netcorenoc/secret.key)" = 600'
          docker compose exec -T netcorenoc python -m netcorenoc audit verify
      - name: The password was generated, and is in no environment
        run: |
          docker compose exec -T postgres sh -c 'test -s /run/netcorenoc-secrets/db_password'
          docker compose exec -T postgres sh -c 'test -s /run/netcorenoc-secrets/db_admin_password'
          ! docker compose exec -T netcorenoc test -r /run/netcorenoc-secrets/db_admin_password
          ! docker compose exec -T netcorenoc test -r /run/netcorenoc-secrets/db_password  # the owner's
          ! docker compose exec -T netcorenoc env | grep -i -E 'password=.+'
          ! docker compose exec -T postgres env | grep -E '^POSTGRES_PASSWORD='
      - name: The managed-database override parses
        run: |
          mkdir -p secrets && printf 'x' > secrets/db_password.txt
          NETCORENOC_DATABASE_URL='postgresql://postgres.ref@aws-0-x.pooler.supabase.com:5432/postgres?sslmode=require' \
            docker compose -f docker-compose.yml -f docker-compose.supabase.yml config --quiet
      - name: Logs, on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Down
        if: always()
        run: docker compose down --volumes
