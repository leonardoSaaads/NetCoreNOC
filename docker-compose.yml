# Self-contained NetCoreNOC — one command, no external services:
#
#     docker compose up --build
#
# This wraps the SAME single process the Dockerfile builds (one asyncio process, one SQLite
# file, one static UI). It changes nothing about the runtime; it only expresses the hardened
# `docker run` recipe (read-only rootfs, all capabilities dropped, no privilege escalation,
# tmpfs /tmp, DB on a named volume) declaratively.
#
# Configuration is optional. Copy .env.example to .env and edit it to set an allowlist, TLS,
# retention, etc. `.env` is git-ignored and is the ONLY place secrets belong — never the image
# or this file. With no .env, NetCoreNOC starts with its zero-config defaults (and warns admins
# in the UI about the empty allowlist / missing TLS).
#
# ## Docker Desktop's "Enable Watch" button does nothing here, and that is deliberate
#
# There is no `develop:` section and no `watch:` key in this file, so Compose has nothing to
# watch; the prompt is Docker's generic offer, not a feature of this project (v0.15.3, #248).
# It is not an omission. This file is the **hardened production recipe** — `read_only: true`,
# every capability dropped, no privilege escalation — and `watch` is a development loop that
# syncs source into a running container, which a read-only root filesystem exists to prevent.
#
# To develop, run the process directly. There is no build step to wait for:
#
#     pip install -e ".[dev]"
#     make run                     # python -m netcorenoc.main
#
# The console is static ES modules served from disk, so editing `src/netcorenoc/ui/**` and
# reloading the browser is the whole edit loop — nothing to compile, nothing to sync, and no
# container to rebuild.

services:
  netcorenoc:
    build: .
    image: netcorenoc:local
    container_name: netcorenoc
    restart: unless-stopped

    # UDP 162 = SNMP trap listener; 8080 = web UI + API. To avoid binding a privileged port
    # (and the CAP_NET_BIND_SERVICE below), map a high host port to 162 instead, e.g.
    # "1162:1162/udp" together with NETCORENOC_TRAP_PORT=1162 in .env — then drop the cap_add.
    ports:
      - "162:162/udp"
      - "8080:8080"

    # --- hardening (mirrors the SECURITY.md / Dockerfile `docker run` recipe) ---------------
    read_only: true                       # root filesystem is immutable...
    tmpfs:
      - /tmp                              # ...with a writable tmpfs for scratch...
    volumes:
      - netcorenoc-data:/home/netcorenoc  # ...and the SQLite DB (+ WAL) on a named volume.
    cap_drop:
      - ALL
    cap_add:
      # Needed ONLY to bind the privileged trap port (UDP 162) as the non-root container user
      # (uid 10001). Remove this line if you map a high port instead (see the ports note above).
      - CAP_NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

    # --- resource limits (v0.16.4) ---------------------------------------------------------
    #
    # **What happens when each is hit, because a limit whose consequence is unstated is a limit
    # nobody can size.**
    #
    #   * **memory** — the kernel OOM-kills the process. `restart: unless-stopped` brings it back,
    #     the SQLite WAL means the database survives, and **every trap in flight at that moment is
    #     lost with no ingest gap recorded** — the gap counter lives in the process that died. That
    #     is the one failure this appliance cannot account for afterwards, which is why the limit
    #     is set well above what it needs rather than tightly.
    #   * **cpus** — the process is throttled, not killed. Correlation falls behind the wire, the
    #     queue grows, and the appliance says so: `queue_depth` climbs in the health control and,
    #     if the queue fills, overflow IS counted as an ingest gap. Visible and recoverable.
    #
    # **The numbers, and where they come from.** The appliance is one asyncio process with one
    # SQLite file and a bounded in-memory queue; `tests/test_perf.py::burst` drives 100 000 traps
    # in a second through the real path. 512 MiB is roughly four times what that burst needs and
    # leaves the page cache room; 1.0 CPU is one core, which the single event loop is bounded by
    # anyway. `reservations` is what the scheduler guarantees, not what the container may use.
    #
    # Raise `memory` before `cpus` if you are unsure: one costs latency you can see, the other
    # costs traps you cannot.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    environment:
      # Defaults keep `docker compose up` working with no .env. Override in .env.
      NETCORENOC_DB: /home/netcorenoc/netcorenoc.db
      NETCORENOC_ALLOWLIST: ${NETCORENOC_ALLOWLIST:-}
      NETCORENOC_RETENTION_DAYS: ${NETCORENOC_RETENTION_DAYS:-7}
      NETCORENOC_AUDIT_RETENTION_DAYS: ${NETCORENOC_AUDIT_RETENTION_DAYS:-365}
      NETCORENOC_LOG_JSON: ${NETCORENOC_LOG_JSON:-}
      # TLS is opt-in — see the commented profile below.
      NETCORENOC_TLS_CERT: ${NETCORENOC_TLS_CERT:-}
      NETCORENOC_TLS_KEY: ${NETCORENOC_TLS_KEY:-}

    healthcheck:
      # Uses the interpreter already in the image (slim images have no curl/wget). /healthz is
      # unauthenticated and returns ok + version.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # --- TLS + allowlist profile (commented; uncomment and set values in .env) --------------
    # NetCoreNOC can terminate TLS itself. Mount the cert/key read-only and point the env at
    # them; the session cookie then automatically gains the Secure flag. Set a real allowlist.
    #
    #   environment:
    #     NETCORENOC_ALLOWLIST: "10.20.0.0/16,192.0.2.10"
    #     NETCORENOC_TLS_CERT: /run/tls/tls.crt
    #     NETCORENOC_TLS_KEY: /run/tls/tls.key
    #   volumes:
    #     - netcorenoc-data:/home/netcorenoc
    #     - ./tls/tls.crt:/run/tls/tls.crt:ro
    #     - ./tls/tls.key:/run/tls/tls.key:ro
    #
    # (Alternatively, front NetCoreNOC with a TLS reverse proxy and keep this listener plain
    #  HTTP on an internal network — see docs/security.md.)

volumes:
  netcorenoc-data:
