# Self-contained NetCoreNOC — one command, nothing to configure first:
#
#     docker compose up --build
#
# Five services, one of them on request (ADRs #452, #453):
#
#   * `netcorenoc` — the appliance the Dockerfile builds: the trap receiver, the correlator and
#     the console, hardened (read-only rootfs, every capability dropped but one, no privilege
#     escalation, tmpfs /tmp). Its own volume holds the trap spool and the secret key that seals
#     personal data and secrets in the database. It connects as `netcorenoc_app`, a role that owns
#     nothing: it may read and write rows, and may not alter, drop or truncate a table, disable a
#     trigger, or delete an audit row;
#   * `db-migrate` — runs once before it, as the schema's owner `netcorenoc`: creates and migrates
#     the schema and grants `netcorenoc_app` its privileges. Only it holds the owner's password;
#   * `postgres` — the database, on an internal network with no published port, its data on a
#     named volume, tuned for this workload (see `command:`);
#   * `db-import` — never started by `up`: the one-off copy of a v0.30.x SQLite file
#     (`docker compose --profile import run --rm db-import`, MIGRATION.md), as the schema's owner;
#   * `db-secret` — runs once, before the rest: it writes three random passwords into a volume
#     only these containers mount, if none is there yet, each readable by the one container that
#     needs it (and the database's, which sets them): `db_admin_password`, the cluster superuser's
#     (`postgres`, initialisation and maintenance); `db_password`, the schema owner's
#     (`db-migrate`); `db_app_password`, the runtime role's (`netcorenoc`). Neither application
#     role is a superuser (`configs: netcorenoc-role`). No password is typed, stored in `.env`, in
#     this file, in the image, or in any container's environment.
#
# Configuration is optional. Copy .env.example to .env and edit it to set an allowlist, TLS,
# retention, etc. `.env` is git-ignored and is the ONLY place secrets belong — never the image
# or this file. With no .env, NetCoreNOC starts with its zero-config defaults (and warns admins
# in the UI about the empty allowlist / missing TLS).
#
# A managed PostgreSQL instead (Supabase, RDS, Cloud SQL, your own cluster): see
# `docker-compose.supabase.yml` and docs/configure.md#database.
#
# ## Docker Desktop's "Enable Watch" button does nothing here, and that is deliberate
#
# There is no `develop:` section and no `watch:` key in this file, so Compose has nothing to
# watch; the prompt is Docker's generic offer, not a feature of this project (v0.15.3, #248).
# It is not an omission. This file is the **hardened production recipe** — `read_only: true`,
# every capability dropped, no privilege escalation — and `watch` is a development loop that
# syncs source into a running container, which a read-only root filesystem exists to prevent.
#
# To develop, run the process directly. There is no build step to wait for:
#
#     pip install -e ".[dev]"
#     make run                     # python -m netcorenoc.main
#
# The console is static ES modules served from disk, so editing `src/netcorenoc/ui/**` and
# reloading the browser is the whole edit loop — nothing to compile, nothing to sync, and no
# container to rebuild.

services:
  db-secret:
    # The database image's own shell, so nothing else is pulled or built for a one-line job.
    image: postgres:17.5-alpine
    user: "0"                             # root, only to chown the file it writes, then it exits
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                             # netcorenoc (10001), db-migrate (10002), postgres (70)
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - netcorenoc-secrets:/run/netcorenoc-secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        dir=/run/netcorenoc-secrets
        umask 377
        for name in db_admin_password db_password db_app_password; do
          [ -s "$$dir/$$name" ] || head -c 48 /dev/urandom | base64 | tr -d '\n=+/' > "$$dir/$$name"
        done
        chown 70:70 "$$dir/db_admin_password"     # the database container alone
        chmod 0400 "$$dir/db_admin_password"
        chown 10002:70 "$$dir/db_password"        # db-migrate; and the init script (group 70)
        chmod 0440 "$$dir/db_password"
        chown 10001:70 "$$dir/db_app_password"    # the appliance; and the init script
        chmod 0440 "$$dir/db_app_password"
    restart: "no"

  postgres:
    # PostgreSQL 15 or newer is required; 17 is what this file is tested with. Pin by digest in
    # production (`docker inspect --format='{{index .RepoDigests 0}}' postgres:17.5-alpine`).
    image: postgres:17.5-alpine
    container_name: netcorenoc-postgres
    restart: unless-stopped
    depends_on:
      db-secret:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres             # the superuser: initialisation and maintenance only
      POSTGRES_DB: netcorenoc
      POSTGRES_PASSWORD_FILE: /run/netcorenoc-secrets/db_admin_password
      # SCRAM-SHA-256 for every connection, including the first role's.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
    volumes:
      - netcorenoc-pgdata:/var/lib/postgresql/data
      - netcorenoc-secrets:/run/netcorenoc-secrets:ro
    configs:
      # Run once, when the data directory is first initialised.
      - source: netcorenoc-role
        target: /docker-entrypoint-initdb.d/10-netcorenoc-role.sql
    networks:
      - backend
    # The entrypoint starts as root to own its data directory, then drops to `postgres`: these are
    # the capabilities that needs, and nothing else.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    # Sized for the limits below (1 GiB). The workload is many small transactions from one writer
    # plus a few console readers: a modest buffer cache, no JIT (it slows short queries), WAL
    # compressed, checkpoints spread out, statistics on every statement (`pg_stat_statements`)
    # so a slow query can be named, and any statement over a second logged.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - jit=off
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      - -c
      # A slow statement is logged without its bound values: they include password hashes, sealed
      # values and whatever an operator typed (ADR #453).
      - log_parameter_max_length=0
      - -c
      - idle_in_transaction_session_timeout=300s
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "netcorenoc", "-d", "netcorenoc", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

  db-migrate:
    # The same image, as another user (10002), so the appliance's user cannot read the owner's
    # password file. Creates or migrates the schema, grants the runtime role, and exits.
    build: .
    image: netcorenoc:local
    user: "10002"
    command: ["python", "-m", "netcorenoc", "db", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - netcorenoc-secrets:/run/netcorenoc-secrets:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NETCORENOC_DATABASE_URL: postgresql://netcorenoc@postgres:5432/netcorenoc
      NETCORENOC_DATABASE_PASSWORD_FILE: /run/netcorenoc-secrets/db_password
      NETCORENOC_DB_SCHEMA: ${NETCORENOC_DB_SCHEMA:-netcorenoc}
      NETCORENOC_DB_RUNTIME_ROLE: netcorenoc_app

  db-import:
    # One-off and explicit — never started by `docker compose up`: copies a v0.30.x SQLite file
    # into the new schema (MIGRATION.md). As the schema's owner, because the import replaces seeded
    # rows of append-only tables; with the appliance's data volume, where the old file lives and
    # where the secret key is created for the appliance (uid 10001) to find. Group 70 reads the
    # owner's password file; the long-running appliance is never given that group.
    #   docker compose --profile import run --rm db-import
    profiles: ["import"]
    build: .
    image: netcorenoc:local
    user: "10001:70"
    command: ["python", "-m", "netcorenoc", "db", "import-sqlite", "/home/netcorenoc/netcorenoc.db"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - netcorenoc-data:/home/netcorenoc
      - netcorenoc-secrets:/run/netcorenoc-secrets:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NETCORENOC_DATABASE_URL: postgresql://netcorenoc@postgres:5432/netcorenoc
      NETCORENOC_DATABASE_PASSWORD_FILE: /run/netcorenoc-secrets/db_password
      NETCORENOC_DB_SCHEMA: ${NETCORENOC_DB_SCHEMA:-netcorenoc}
      NETCORENOC_DB_RUNTIME_ROLE: netcorenoc_app
      NETCORENOC_DATA_DIR: /home/netcorenoc

  netcorenoc:
    build: .
    image: netcorenoc:local
    container_name: netcorenoc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - default

    # UDP 162 = SNMP trap listener; 8080 = web UI + API. To avoid binding a privileged port,
    # set NETCORENOC_TRAP_PORT=1162 in .env: the mapping below and the process both follow it
    # (until v0.28.0 only the comment did, and the process kept listening on 162). Then you may
    # also remove the cap_add below.
    ports:
      - "${NETCORENOC_TRAP_PORT:-162}:${NETCORENOC_TRAP_PORT:-162}/udp"
      - "8080:8080"

    # --- hardening (mirrors the SECURITY.md / Dockerfile `docker run` recipe) ---------------
    read_only: true                       # root filesystem is immutable...
    tmpfs:
      - /tmp                              # ...with a writable tmpfs for scratch...
    volumes:
      - netcorenoc-data:/home/netcorenoc  # ...the trap spool and the secret key on a volume...
      - netcorenoc-secrets:/run/netcorenoc-secrets:ro  # ...and the database password, read-only.
    cap_drop:
      - ALL
    cap_add:
      # Needed ONLY to bind the privileged trap port (UDP 162) as the non-root container user
      # (uid 10001). Remove this line if you map a high port instead (see the ports note above).
      - CAP_NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

    # --- resource limits (v0.16.4) ---------------------------------------------------------
    #
    # **What happens when each is hit, because a limit whose consequence is unstated is a limit
    # nobody can size.**
    #
    #   * **memory** — the kernel OOM-kills a process. `restart: unless-stopped` brings it back and
    #     PostgreSQL keeps every committed batch. Since #450 every accepted trap is in the **spool on disk**
    #     before anything else happens to it, and the engine resumes after the last trap it
    #     classified: what is lost is at most what the receiver held for the few milliseconds before
    #     its next write. Memory no longer grows with a backlog, so 512 MiB is generous.
    #   * **cpus** — the processes are throttled, not killed. Classification falls behind the wire,
    #     the backlog grows **in the spool**, and the appliance says so: the Overview's trap
    #     pipeline shows the backlog, its oldest wait and every trap past the KPI (#451). Nothing is
    #     dropped while the spool has room (`NETCORENOC_SPOOL_MAX_MB`).
    #
    # **The numbers, and where they come from.** Three processes since #450: the receiver (reads
    # the socket and appends to the spool), the decoder, and the main one (correlation, the
    # console). 2.0 CPUs are one core for correlation and one for receiving and decoding;
    # `make storm` measures a host. `reservations` is what the scheduler guarantees, not what the
    # container may use. Raise `cpus` to cut how far behind a storm puts classification.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    environment:
      # Defaults keep `docker compose up` working with no .env. Override in .env.
      NETCORENOC_DATABASE_URL: ${NETCORENOC_DATABASE_URL:-postgresql://netcorenoc_app@postgres:5432/netcorenoc}
      NETCORENOC_DATABASE_PASSWORD_FILE: ${NETCORENOC_DATABASE_PASSWORD_FILE:-/run/netcorenoc-secrets/db_app_password}
      NETCORENOC_DB_SCHEMA: ${NETCORENOC_DB_SCHEMA:-netcorenoc}
      NETCORENOC_DATA_DIR: /home/netcorenoc
      NETCORENOC_TRAP_PORT: ${NETCORENOC_TRAP_PORT:-162}
      NETCORENOC_ALLOWLIST: ${NETCORENOC_ALLOWLIST:-}
      NETCORENOC_RETENTION_DAYS: ${NETCORENOC_RETENTION_DAYS:-7}
      NETCORENOC_AUDIT_RETENTION_DAYS: ${NETCORENOC_AUDIT_RETENTION_DAYS:-365}
      NETCORENOC_LOG_JSON: ${NETCORENOC_LOG_JSON:-}
      NETCORENOC_REARM_S: ${NETCORENOC_REARM_S:-3600}
      # v0.30.0: keeps the SMTP password out of the database; empty = use Settings -> Email's.
      NETCORENOC_SMTP_PASSWORD: ${NETCORENOC_SMTP_PASSWORD:-}
      # TLS is opt-in — see the commented profile below.
      NETCORENOC_TLS_CERT: ${NETCORENOC_TLS_CERT:-}
      NETCORENOC_TLS_KEY: ${NETCORENOC_TLS_KEY:-}

    healthcheck:
      # Uses the interpreter already in the image (slim images have no curl/wget). /healthz is
      # unauthenticated and returns ok + version.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # --- TLS + allowlist profile (commented; uncomment and set values in .env) --------------
    # NetCoreNOC can terminate TLS itself. Mount the cert/key read-only and point the env at
    # them; the session cookie then automatically gains the Secure flag. Set a real allowlist.
    #
    #   environment:
    #     NETCORENOC_ALLOWLIST: "10.20.0.0/16,192.0.2.10"
    #     NETCORENOC_TLS_CERT: /run/tls/tls.crt
    #     NETCORENOC_TLS_KEY: /run/tls/tls.key
    #   volumes:
    #     - netcorenoc-data:/home/netcorenoc
    #     - ./tls/tls.crt:/run/tls/tls.crt:ro
    #     - ./tls/tls.key:/run/tls/tls.key:ro
    #
    # (Alternatively, front NetCoreNOC with a TLS reverse proxy and keep this listener plain
    #  HTTP on an internal network — see docs/security.md.)

configs:
  # The two application roles, least privilege: `netcorenoc` owns the database (and so the
  # schema it creates); `netcorenoc_app` may only connect, and is granted rows by `db-migrate`.
  # Neither is a superuser. A file, not inline `content:` — Compose cannot write a config into a
  # read-only container, only bind-mount one.
  netcorenoc-role:
    file: ./deploy/postgres/10-netcorenoc-role.sql

networks:
  # The database's network: no published port and no route out. Only the appliance joins it.
  backend:
    internal: true

volumes:
  netcorenoc-data:      # the trap spool
  netcorenoc-pgdata:    # the database
  netcorenoc-secrets:   # the generated database passwords
