[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netcorenoc"
version = "0.16.1"
description = "Zero-configuration SNMP trap correlator: devices, topology, and root cause learned from the raw trap stream"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "NetCoreNOC contributors" }]
keywords = ["snmp", "trap", "alarm-correlation", "noc", "root-cause"]
dependencies = [
    "pysnmp>=7.1",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "vulture>=2.11",
    "build>=1.2",
    # The build BACKEND, in the dev environment rather than only in `[build-system].requires`.
    # `tests/test_supply_chain.py` builds a wheel the way the Dockerfile builds one (F85), and it
    # does so with `--no-isolation` so the guard does not need the network — which means the
    # backend has to already be importable here. A Python 3.12 venv ships no setuptools.
    # Dev/CI tooling only: the runtime dependency list above is unchanged at five.
    "setuptools>=69",
]

[project.urls]
Homepage = "https://github.com/leonardoSaaads/NetCoreNOC"

[tool.setuptools.packages.find]
where = ["src"]
include = ["netcorenoc*"]

[tool.setuptools.package-data]
# Ship the whole static UI (F12): index.html alone left a built wheel serving a UI whose
# app.js / style.css / vendored d3 all 404 — the Dockerfile does `pip install .`, so the
# container UI was broken.
#
# **ONE RECURSIVE GLOB, not one glob per directory level (F85, DECISIONS #251).**
#
# This listed `ui/*.js`, `ui/app/*.js`, `ui/app/views/*.js` — a line added each time the console
# grew a level. v0.15.3 added `ui/app/views/parts/` and did not add the fourth line, so a wheel
# built the way the Dockerfile builds one carried the console minus five modules, and the
# container's first page load raised five `RuntimeError: File at path … does not exist`.
#
# A glob per level is a rule that must be re-obeyed every time the tree changes, which is the
# same shape as the thing it was guarding against. `**` cannot miss a level, so adding a
# directory is no longer a packaging decision.
netcorenoc = [
    "migrations/*.sql",
    "ui/**/*",  # every file under ui/, at any depth — see above
    # `**` does NOT match a path component beginning with a dot, so the RFC 9116 security.txt
    # needs its own line. Found by building a wheel and looking for it, not by reading the glob:
    # `ui/**/*` alone shipped 49 UI files and left this one behind.
    "ui/.well-known/*",
    "py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests", "eval"]
# The vulture dead-code allowlist is intentionally a list of bare names (not real code).
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RUF"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
[tool.ruff.lint.isort]
# src/ layout makes `netcorenoc` the (only) first-party package. The eval/tools dev helpers
# (imported by tests and the harness) are local dev/test modules, not the distributed package —
# classifying them as local-folder keeps them in their own trailing import group, exactly as
# before the move, so the reorg touches no test/eval import block.
known-local-folder = [
    "metrics", "trap_replay", "harness", "corpus_gen", "scenario_dsl", "trap_sim",
    "util", "authutil", "apisource", "behaviour_identity",
]
[tool.ruff.lint.per-file-ignores]
"tools/*" = ["T20"]  # replay tool talks to the operator on stdout
# The evidence tools (v0.13.0) carry **verbatim source fragments** as injection anchors and mutant
# bodies: each string must match `src/` character for character or the injection does not apply and
# the demonstration silently measures nothing. Re-wrapping them to satisfy a line limit would break
# exactly the property that makes them evidence, so E501 is lifted here and nowhere else.
"tools/evidence/*" = ["T20", "E501"]
"src/netcorenoc/__main__.py" = ["T20"]  # the audit CLI talks to the operator on stdout

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tools", "tests", "eval"]
mypy_path = ["src", "eval", "tools"]

[[tool.mypy.overrides]]
module = ["pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules call into pysnmp/pyasn1, which ship no type information.
module = ["netcorenoc.ingest.receiver", "trap_replay", "harness"]
disallow_untyped_calls = false

[tool.bandit]
# B101: asserts in store.py guard internal invariants (RETURNING always yields a row);
# they are not access-control logic and the process is never run with -O.
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    # v0.12.0. Tests that actually execute `ui/app.js` in the harness DOM, so `make dom` can
    # report how many were EXECUTED. They skip — loudly, with a reason naming the requirement —
    # when Node is absent, and a skipped DOM suite must never be read as a green one.
    "dom: drives the DOM harness in a Node subprocess (skipped when Node >= 22 is absent)",
]

[tool.coverage.run]
source = ["netcorenoc"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
