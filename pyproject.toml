[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netcorenoc"
version = "0.13.0"
description = "Zero-configuration SNMP trap correlator: devices, topology, and root cause learned from the raw trap stream"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "NetCoreNOC contributors" }]
keywords = ["snmp", "trap", "alarm-correlation", "noc", "root-cause"]
dependencies = [
    "pysnmp>=7.1",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "vulture>=2.11",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/leonardoSaaads/NetCoreNOC"

[tool.setuptools.packages.find]
where = ["src"]
include = ["netcorenoc*"]

[tool.setuptools.package-data]
# Ship the whole static UI (F12): index.html alone left a built wheel serving a UI whose
# app.js / style.css / vendored d3 all 404 — the Dockerfile does `pip install .`, so the
# container UI was broken. Keep the CHECKSUMS.txt supply-chain pin alongside the vendored asset.
netcorenoc = [
    "migrations/*.sql",
    "ui/*.html",
    "ui/*.js",
    # v0.13.0: the console is an ES module graph (ADR #175). Two more globs, one per level, so a
    # wheel carries every module the browser will ask for. F12 was a wheel that shipped index.html
    # and nothing else; tests/test_supply_chain.py asserts every UI file matches a glob here.
    "ui/app/*.js",
    "ui/app/views/*.js",
    "ui/*.css",
    "ui/vendor/*",
    "ui/.well-known/*",  # RFC 9116 security.txt, served by the app
    "py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests", "eval"]
# The vulture dead-code allowlist is intentionally a list of bare names (not real code).
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RUF"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
[tool.ruff.lint.isort]
# src/ layout makes `netcorenoc` the (only) first-party package. The eval/tools dev helpers
# (imported by tests and the harness) are local dev/test modules, not the distributed package —
# classifying them as local-folder keeps them in their own trailing import group, exactly as
# before the move, so the reorg touches no test/eval import block.
known-local-folder = [
    "metrics", "trap_replay", "harness", "corpus_gen", "scenario_dsl", "trap_sim",
    "util", "authutil", "apisource",
]
[tool.ruff.lint.per-file-ignores]
"tools/*" = ["T20"]  # replay tool talks to the operator on stdout
"src/netcorenoc/__main__.py" = ["T20"]  # the audit CLI talks to the operator on stdout

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tools", "tests", "eval"]
mypy_path = ["src", "eval", "tools"]

[[tool.mypy.overrides]]
module = ["pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules call into pysnmp/pyasn1, which ship no type information.
module = ["netcorenoc.receiver", "trap_replay", "harness"]
disallow_untyped_calls = false

[tool.bandit]
# B101: asserts in store.py guard internal invariants (RETURNING always yields a row);
# they are not access-control logic and the process is never run with -O.
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    # v0.12.0. Tests that actually execute `ui/app.js` in the harness DOM, so `make dom` can
    # report how many were EXECUTED. They skip — loudly, with a reason naming the requirement —
    # when Node is absent, and a skipped DOM suite must never be read as a green one.
    "dom: drives the DOM harness in a Node subprocess (skipped when Node >= 22 is absent)",
]

[tool.coverage.run]
source = ["netcorenoc"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
