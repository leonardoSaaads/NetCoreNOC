[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opticorr"
version = "0.3.0"
description = "Zero-configuration SNMP trap correlator: devices, topology, and root cause learned from the raw trap stream"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "OptiCorr contributors" }]
keywords = ["snmp", "trap", "alarm-correlation", "noc", "root-cause"]
dependencies = [
    "pysnmp>=7.1",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/leonardoSaaads/NewProjectNetworj"

[tool.setuptools.packages.find]
include = ["opticorr*"]

[tool.setuptools.package-data]
opticorr = ["migrations/*.sql", "ui/*.html", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["opticorr", "tools", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RUF"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
[tool.ruff.lint.per-file-ignores]
"tools/*" = ["T20"]  # replay tool talks to the operator on stdout
"opticorr/__main__.py" = ["T20"]  # the audit CLI talks to the operator on stdout

[tool.mypy]
strict = true
python_version = "3.12"
files = ["opticorr", "tools", "tests", "eval"]
mypy_path = ["eval", "tools"]

[[tool.mypy.overrides]]
module = ["pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules call into pysnmp/pyasn1, which ship no type information.
module = ["opticorr.receiver", "trap_replay", "harness"]
disallow_untyped_calls = false

[tool.bandit]
# B101: asserts in store.py guard internal invariants (RETURNING always yields a row);
# they are not access-control logic and the process is never run with -O.
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["opticorr"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
