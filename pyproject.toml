[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netcorenoc"
version = "0.30.0"
description = "Zero-configuration SNMP trap correlator: devices, topology, and root cause learned from the raw trap stream"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "NetCoreNOC contributors" }]
keywords = ["snmp", "trap", "alarm-correlation", "noc", "root-cause"]
dependencies = [
    "pysnmp>=7.1",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# v0.30.0 (DECISIONS #444): SNMPv3 *privacy* — decrypting DES/3DES/AES traps — needs a vetted cipher
# implementation, and the standard library has none. Optional, so the core stays five runtime
# dependencies and a v1/v2c or authNoPriv deployment installs nothing more; the Docker image
# installs it. Without it an encrypted trap is quarantined as `v3-privacy-unavailable`.
snmpv3 = ["cryptography>=43"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "vulture>=2.11",
    "build>=1.2",
    # The build BACKEND, in the dev environment rather than only in `[build-system].requires`.
    # `tests/security/test_supply_chain.py` builds a wheel the way the Dockerfile builds one (F85), and it
    # does so with `--no-isolation` so the guard does not need the network — which means the
    # backend has to already be importable here. A Python 3.12 venv ships no setuptools.
    # Dev/CI tooling only: the runtime dependency list above is unchanged at five.
    "setuptools>=69",
    # The `snmpv3` extra, so the suite exercises every privacy protocol (DECISIONS #444).
    "cryptography>=43",
]

[project.urls]
Homepage = "https://github.com/leonardoSaaads/NetCoreNOC"

[tool.setuptools.packages.find]
where = ["src"]
include = ["netcorenoc*"]

[tool.setuptools.package-data]
# Ship the whole static UI (F12): index.html alone left a built wheel serving a UI whose
# app.js / style.css / vendored d3 all 404 — the Dockerfile does `pip install .`, so the
# container UI was broken.
#
# **ONE RECURSIVE GLOB, not one glob per directory level (F85, DECISIONS #251).**
#
# This listed `ui/*.js`, `ui/app/*.js`, `ui/app/views/*.js` — a line added each time the console
# grew a level. v0.15.3 added `ui/app/views/parts/` and did not add the fourth line, so a wheel
# built the way the Dockerfile builds one carried the console minus five modules, and the
# container's first page load raised five `RuntimeError: File at path … does not exist`.
#
# A glob per level is a rule that must be re-obeyed every time the tree changes, which is the
# same shape as the thing it was guarding against. `**` cannot miss a level, so adding a
# directory is no longer a packaging decision.
netcorenoc = [
    "migrations/*.sql",
    "ui/**/*",  # every file under ui/, at any depth — see above
    # `**` does NOT match a path component beginning with a dot, so the RFC 9116 security.txt
    # needs its own line. Found by building a wheel and looking for it, not by reading the glob:
    # `ui/**/*` alone shipped 49 UI files and left this one behind.
    "ui/.well-known/*",
    "py.typed",
    # v0.24.0 (ADR #400): the built-in trap pack — the vendors' trap and object names, built by
    # `tools/trappack_build.py`. Without these lines a wheel would ship a pack that is empty.
    "ingest/trappack.tsv.gz",
    "ingest/trapobjects.tsv.gz",
    # v0.27.0 (ADR #424): the league — one document and one manifest per model kind, plus the
    # benchmark pairs the judge times them on. Data, validated on load. Without this line a wheel
    # would ship an appliance with no model to decide.
    "engine/model/league/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests/support", "tests/lab", "eval"]
# The vulture dead-code allowlist is intentionally a list of bare names (not real code).
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "RUF"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
[tool.ruff.lint.isort]
# src/ layout makes `netcorenoc` the (only) first-party package. The development modules on
# pytest's `pythonpath` are never part of the distributed package, so they sort in their own
# trailing import group. One line per folder; a new helper is added to its folder's line.
known-local-folder = [
    # tests/support/
    "apisource", "authutil", "behaviour_identity", "biasfixture", "dockerignore", "domdriver",
    "fakesmtp", "leaguefixtures", "modelfixtures", "modelutil", "paths", "uifixtures", "util",
    # tests/lab/ (the simulated network element package)
    "ne",
    # tools/
    "corpus_census", "login_art", "trap_replay", "trappack_build",
    # eval/
    "harness", "metrics", "simulation", "synth",
]
[tool.ruff.lint.per-file-ignores]
"tools/*" = ["T20"]  # replay tool talks to the operator on stdout
"src/netcorenoc/__main__.py" = ["T20"]  # the audit CLI talks to the operator on stdout
"eval/synth/*" = ["T20"]  # `make train` reports each stage to the person running it (v0.26.0)

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tools", "tests", "eval"]
mypy_path = ["src", "eval", "tools", "tests/support", "tests/lab"]

[[tool.mypy.overrides]]
module = ["pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules call into pysnmp/pyasn1, which ship no type information.
module = ["netcorenoc.ingest.receiver", "trap_replay", "harness"]
disallow_untyped_calls = false

[tool.bandit]
# B101: asserts in store.py guard internal invariants (RETURNING always yields a row);
# they are not access-control logic and the process is never run with -O.
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The helpers in `tests/support/`, the lab's `ne` package, and the dev trees the tests drive. Stated
# once here rather than as a `sys.path.insert` at the top of each test that needed one.
pythonpath = ["tests/support", "tests/lab", "tools", "eval"]
markers = [
    # v0.12.0. Tests that actually execute `ui/app.js` in the harness DOM, so `make dom` can
    # report how many were EXECUTED. They skip — loudly, with a reason naming the requirement —
    # when Node is absent, and a skipped DOM suite must never be read as a green one.
    "dom: drives the DOM harness in a Node subprocess (skipped when Node >= 22 is absent)",
]

[tool.coverage.run]
source = ["netcorenoc"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
