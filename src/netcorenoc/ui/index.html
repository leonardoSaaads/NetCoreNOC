<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetCoreNOC</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!--
  The document is a mount point and nothing else.

  v0.12.0's index.html declared ten <section class="panel"> elements and app.js pruned the ones a
  role could not hold. That made "is this screen absent?" a question about a DELETION, and F53 is
  what that costs: the loaders had no capability check, and a viewer's zero-request property held
  only because pruning had removed the container a loader dereferenced.

  Here the screens do not exist in the document at all. A view is rendered because the router
  resolved its capability and decided to render it, so absence is the default and presence is the
  decision — which is the shape a deny-by-default authorisation surface has to have.

  No inline script, no inline style, no import map. Two script tags and a stylesheet, all
  same-origin, all files that exist on disk byte-for-byte as served.
-->
<div id="root"></div>

<noscript>
  <div class="noscript">
    <h1>Net<span>CoreNOC</span></h1>
    <p>This console needs JavaScript. The appliance itself does not: correlation, ingestion and
       the API run without a browser, and <code>python -m netcorenoc</code> exposes the same
       reports this console reads.</p>
  </div>
</noscript>

<!--
  d3 stays a CLASSIC script and is loaded first, deliberately.

  It is a UMD bundle: loaded this way it defines the `d3` global, which `app/views/graph.js` reads
  as `globalThis.d3`. A classic script runs before any module (modules are deferred), so the
  global exists by the time the console boots. Importing d3 as an ES module would mean either a
  bare specifier — an import map, which is an inline script the CSP forbids — or vendoring a
  second copy of the same 279 706 bytes in a different module format.

  This is also the only screen d3 serves, and the only screen no test executes. See
  `app/views/graph.js` and `docs/security/SECURITY-REVIEW-0.13.0.md`.
-->
<script src="/vendor/d3.v7.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
