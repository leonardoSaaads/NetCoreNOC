<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="NetCoreNOC">
  <!-- The console's brand mark (ADR #479): an N drawn as a network, four nodes and three links,
       the diagonal the broker's correlation and the ringed node the probable root cause. Served
       from this origin because the CSP's `img-src 'self'` forbids a `data:` URI (F96). No text,
       no external reference, no script. The same drawing as `LogoMark` in `app/icons.js`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa0ff"/>
      <stop offset="1" stop-color="#3355e8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tile)"/>
  <path d="M9.5 22.5V9.5L22.5 22.5V12.4" fill="none" stroke="#ffffff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="9.5" cy="22.5" r="2.6" fill="#ffffff"/>
  <circle cx="9.5" cy="9.5" r="2.6" fill="#ffffff"/>
  <circle cx="22.5" cy="22.5" r="2.6" fill="#ffffff"/>
  <circle cx="22.5" cy="9.5" r="2.5" fill="none" stroke="#ffffff" stroke-width="2"/>
</svg>
